[project]
name = "retail-transfer-engine"
version = "0.1.0"
description = "Suggests inter-store stock transfers for a four-store fashion retailer (portfolio project)."
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.38",
    "pandas>=2.2",
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["transfer_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
